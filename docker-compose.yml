services:
  mailsorter:
    image: ghcr.io/sandavdesigns/mailsorter:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${MAILSORTER_PORT:-8080}:8080"
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt sein}
      TEST_MODE: ${TEST_MODE:-true}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-50}
      MAX_MESSAGE_ATTACHMENTS_MB: ${MAX_MESSAGE_ATTACHMENTS_MB:-100}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - mailsorter_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mailsorter_data:
